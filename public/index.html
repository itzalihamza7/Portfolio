<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ali Hamza | Full-Stack Software Engineer</title>
    <meta
      name="description"
      content="Ali Hamza is a full-stack software engineer (Ruby on Rails, Node.js, React, Vue.js, Python) and MSc student in Web and Data Science at Universität Koblenz. Ask the AI assistant anything about his experience."
    />
    <meta property="og:title" content="Ali Hamza | Full-Stack Software Engineer" />
    <meta
      property="og:description"
      content="Full-stack engineer building web products end to end, with data and AI. Ask the AI assistant about his experience, skills and projects."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.alihamza.co/" />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
