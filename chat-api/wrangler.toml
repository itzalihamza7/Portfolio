name = "portfolio-chat-api"
main = "src/index.js"
compatibility_date = "2026-05-01"

[vars]
# Sites allowed to call the API (comma separated).
ALLOWED_ORIGINS = "https://www.alihamza.co,https://alihamza.co,http://localhost:3000"
# Optional: override the OpenAI model (default gpt-5.4-mini)
# OPENAI_MODEL = "gpt-5.4"

# The OpenAI API key is a secret, never a var:
#   npx wrangler secret put OPENAI_API_KEY
# For local development put it in chat-api/.dev.vars instead:
#   OPENAI_API_KEY=sk-...
